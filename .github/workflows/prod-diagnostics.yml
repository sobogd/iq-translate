name: Prod diagnostics (manual)
on:
  workflow_dispatch:
  # Also run when the marker file changes — the only way to trigger it from a
  # token without workflow-dispatch rights. Touch diag.txt to re-run.
  push:
    branches: [main]
    paths: ["diag.txt"]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only diagnostics over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "===== DATE (UTC) ====="
            date -u +"%Y-%m-%d %H:%M:%S UTC"
            echo "===== PM2 STATUS ====="
            pm2 status 2>&1 | head -40
            echo "===== translator (Next.js) last logs ====="
            pm2 logs translator --lines 200 --nostream 2>&1 | tail -n 260
            echo "===== LAST TRANSLATIONS FROM DB ====="
            cd /home/deploy/apps/translator
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            node -e '
              const { PrismaClient } = require("@prisma/client");
              const p = new PrismaClient();
              (async () => {
                const rows = await p.translation.findMany({
                  orderBy: { createdAt: "desc" },
                  take: 4,
                  include: { conversation: true },
                });
                for (const r of rows) {
                  console.log("ROW", JSON.stringify({
                    id: r.id,
                    createdAt: r.createdAt,
                    sourceLang: r.sourceLang,
                    conversationId: r.conversationId,
                    convOwner: r.conversation && r.conversation.ownerKey,
                    convSrc: r.conversation && r.conversation.sourceLang,
                    convTgt: r.conversation && r.conversation.targetLang,
                    convWrite: r.conversation && r.conversation.writeLang,
                    transcript: r.transcript,
                    translation: r.translation,
                  }));
                }
                await p.$disconnect();
              })().catch((e) => { console.error("DBERR", e && e.message); process.exit(1); });
            '
