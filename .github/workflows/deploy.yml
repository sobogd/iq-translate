name: Deploy to Prod (release)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: the IndexNow step below diffs this push against the
          # previous one to work out which pages changed. The default
          # shallow clone has no such range and would force a full submit
          # on every release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install local dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Public half of the Turnstile gate. Must be present at BUILD time:
          # the pages are statically prerendered, so a NEXT_PUBLIC_* value is
          # inlined here, not read from the server's .env at runtime.
          NEXT_PUBLIC_TS_SITE: ${{ secrets.TS_SITE }}

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: ".next/,package.json,package-lock.json,public/,prisma/,services/ocr/,ecosystem-ocr.config.js"
          target: "/home/deploy/apps/translator"
          overwrite: true

      - name: Setup and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:/home/deployer/.npm-global/bin
            cd /home/deploy/apps/translator

            cat > .env <<EOF
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            S3_HOST="${{ secrets.S3_HOST }}"
            S3_REGION="${{ secrets.S3_REGION }}"
            S3_KEY="${{ secrets.S3_KEY }}"
            S3_TOKEN="${{ secrets.S3_TOKEN }}"
            S3_NAME="${{ secrets.S3_NAME }}"
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            ALLOWED_GOOGLE_EMAILS="${{ secrets.ALLOWED_GOOGLE_EMAILS }}"
            # Email OTP sign-in (SMTP).
            SMTP_HOST="${{ secrets.SMTP_HOST }}"
            SMTP_PORT="${{ secrets.SMTP_PORT }}"
            SMTP_USER="${{ secrets.SMTP_USER }}"
            SMTP_PASS="${{ secrets.SMTP_PASS }}"
            FROM_EMAIL="${{ secrets.FROM_EMAIL }}"
            # Sign in with Apple.
            APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            APPLE_KEY_ID="${{ secrets.APPLE_KEY_ID }}"
            APPLE_SERVICES_ID="${{ secrets.APPLE_SERVICES_ID }}"
            APPLE_PRIVATE_KEY="${{ secrets.APPLE_PRIVATE_KEY }}"
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            TS_SITE="${{ secrets.TS_SITE }}"
            TS_SECRET="${{ secrets.TS_SECRET }}"
            # Cookieless analytics. Events are relayed to iq-metrix
            # (lib/analytics/ingest.ts) — INGEST_SHARED_SECRET is the
            # X-Ingest-Key that service requires, must match its own value.
            # The two email lists default to support@iq-rest.com in code, so
            # an unset secret is not a broken deploy.
            INGEST_SHARED_SECRET="${{ secrets.INGEST_SHARED_SECRET }}"
            ANALYTICS_ADMIN_EMAILS="${{ secrets.ANALYTICS_ADMIN_EMAILS }}"
            ANALYTICS_EXCLUDE_EMAILS="${{ secrets.ANALYTICS_EXCLUDE_EMAILS }}"
            OCR_SIDECAR_URL="http://127.0.0.1:8701"
            # Translation engine and speech recognition: both live on the
            # owner's Mac and reach this VPS through the reverse-SSH tunnel
            # (docs/local-llm.md). LLM_CTX has to match the model server's
            # `-c` — lib/llm-limits.ts derives every request budget from it.
            LLM_BASE_URL="${{ secrets.LLM_BASE_URL || 'http://127.0.0.1:18812' }}"
            LLM_MODEL="${{ secrets.LLM_MODEL || 'qwen/qwen3.5-9b' }}"
            LLM_CTX="${{ secrets.LLM_CTX || '32768' }}"
            LLM_REASONING="none"
            LLM_TEMPLATE_KWARGS={"enable_thinking":false}
            STT_BASE_URL="${{ secrets.STT_BASE_URL || 'http://127.0.0.1:18818' }}"
            STT_TIMEOUT_MS="240000"
            PORT="8200"
            EOF

            npm ci --production
            npx prisma migrate deploy
            npx prisma generate
            # PORT must be a real env var — next start ignores PORT from .env file
            PORT=8200 pm2 restart translator --update-env || PORT=8200 pm2 start npm --name "translator" -- start
            pm2 save

            # --- OCR sidecar: its OWN PM2 process, resource-capped (see
            # ecosystem-ocr.config.js). A missing python3 or a failed model
            # warmup must never take the translator deploy down with it —
            # the sidecar is only needed for the image-translate feature.
            # appleboy/ssh-action runs with `set -e`, so every fallible step
            # below is guarded: provisioning problems degrade to a log line.
            if command -v python3 >/dev/null 2>&1; then
              cd /home/deploy/apps/translator/services/ocr

              # Some boxes lack python3-venv (ensurepip missing). Strategy:
              #   1) plain `venv`; 2) `venv --without-pip` + get-pip.py;
              #   3) system pip `--user` (launcher ocr.sh then uses python3).
              if [ ! -x .venv/bin/python ]; then
                rm -rf .venv
                python3 -m venv .venv 2>/dev/null || { rm -rf .venv; python3 -m venv --without-pip .venv 2>/dev/null || true; }
              fi
              if [ -x .venv/bin/python ] && [ ! -x .venv/bin/pip ]; then
                curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/translator-get-pip.py \
                  && .venv/bin/python /tmp/translator-get-pip.py --quiet \
                  || echo "get-pip bootstrap failed — will fall back to system pip"
              fi
              if [ -x .venv/bin/pip ]; then
                ./.venv/bin/pip install --quiet --upgrade pip || true
                ./.venv/bin/pip install --quiet -r requirements.txt || true
              else
                python3 -m pip install --quiet --user --break-system-packages -r requirements.txt || \
                  echo "system pip --user install failed — sidecar deps missing"
              fi

              # Pre-download the rec models so the first real request never
              # stalls behind a download. Output is ALWAYS printed so the
              # deploy log shows why a run failed.
              ./ocr.sh warmup.py > /tmp/translator-ocr-warmup.log 2>&1 || true
              echo "--- translator-ocr warmup log (tail) ---"
              tail -30 /tmp/translator-ocr-warmup.log || true
              echo "--- end warmup log ---"

              cd /home/deploy/apps/translator
              pm2 restart translator-ocr --update-env || pm2 start ecosystem-ocr.config.js
              pm2 save
              # Give uvicorn a moment, then show what the box actually runs.
              sleep 4
              echo "--- translator-ocr health ---"
              curl -s -m 5 http://127.0.0.1:8701/healthz || echo "healthz unreachable yet"
              pm2 logs translator-ocr --lines 25 --nostream || true
              echo "--- end translator-ocr health ---"
            else
              echo "python3 not found — OCR sidecar (translator-ocr) not installed"
            fi

      # IndexNow: tell Bing (and Yandex/Seznam/Naver, one endpoint fans out)
      # what this deploy changed, instead of waiting for the next crawl.
      # Bing's index is what search inside ChatGPT runs on, so this is the
      # cheapest lever on AI visibility we have.
      #
      # Runs on the runner, not the VPS: the script needs git history, and
      # only the built .next is shipped to the server.
      - name: Wait for prod to answer
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://iq-translate.com/sitemap.xml || true)
            if [ "$code" = "200" ]; then echo "prod up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "prod did not answer 200 in 30s"
          exit 1

      - name: Ping IndexNow
        # Never fails the release: the deploy already succeeded and indexing
        # is not release-critical.
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: node scripts/indexnow-submit.mjs
