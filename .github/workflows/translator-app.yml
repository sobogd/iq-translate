name: Translator app (build + publish)

# Сборка и публикация клиента (Flutter) на тот же VPS, что и Next.
#
# Четыре сборки из одного flutter/: web (в /app/ на том же домене — same-origin обязателен
# для куки iqt_anon/iqt_ts_pass и CSRF-проверки Origin в proxy.ts), Android (APK), iOS (ipa)
# и macOS (архив). Все складываются на диск, не в S3: контент маленький, а публикация через
# scripts/vps-publish.sh пишет version.json, по которому клиент обновляется сам.
#
# Контент веба кладётся в релизную директорию + symlink /var/www/translator-app (атомарный
# деплой); нативные артефакты — в стабильную директорию /var/www/translator-app-files,
# вне релизного дерева, иначе веб-деплой их порежет.
#
# Push, тронувший flutter/**, но не поднявший version: в flutter/pubspec.yaml, уронит
# публикацию — та же защита, что у cloudlyru.
#
# Секреты: SERVER_IP, SSH_KEY (те же, что у deploy.yml); TS_SITE (web);
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# (android); ASC_KEY_P8 / IOS_SIGNING_PEM / ASC_KEY_ID / ASC_ISSUER_ID / APPLE_TEAM_ID (ios).

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
  workflow_dispatch:
    inputs:
      force:
        description: Опубликовать поверх того же номера версии
        required: false
        default: false
        type: boolean

concurrency:
  group: iq-translate-app
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Analysis and build
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release --base-href=/app/ --dart-define=TS_SITE="$TS_SITE"
          ver=$(awk -F: '/^version:/{gsub(/ /,"",$2); split($2,a,"+"); print a[1]}' pubspec.yaml)
          test -n "$ver" || { echo "version: не распарсили из pubspec.yaml"; exit 1; }
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/app-release"
          cp -r build/web/. "$GITHUB_WORKSPACE/app-release/"
          echo "$ver" > "$GITHUB_WORKSPACE/app-release/.version"
          rm -rf build/web
        env:
          TS_SITE: ${{ secrets.TS_SITE }}

      - name: Install nginx config for /app/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/translator.conf"
          target: "/etc/nginx/sites-available/"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv -f /etc/nginx/sites-available/translator.conf /etc/nginx/sites-available/iq-translate.conf
            ln -sf /etc/nginx/sites-available/iq-translate.conf /etc/nginx/sites-enabled/iq-translate.conf
            nginx -t && (sudo nginx -s reload || systemctl reload nginx)

      - name: Prepare release directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            rel="/var/www/translator-app/releases/${{ github.sha }}"
            mkdir -p "$rel/app"

      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "app-release/"
          target: "/var/www/translator-app/releases/${{ github.sha }}/app"
          overwrite: true

      - name: Version gate and atomic switch
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            rel="/var/www/translator-app/releases/${{ github.sha }}"
            ver=$(cat "$rel/app/.version")
            cur=$(readlink /var/www/translator-app 2>/dev/null || true)
            if [ -n "$cur" ]; then
              old=$(cat "$cur/app/.version" 2>/dev/null || echo 0)
              latest=$(printf '%s\n%s\n' "$old" "$ver" | sort -V | tail -1)
              if [ "$latest" != "$ver" ] && [ "${{ inputs.force }}" != "true" ]; then
                echo "publishing $ver on top of newer $old — refuse (use force)"
                exit 1
              fi
            fi
            ln -sfn "$rel" /var/www/translator-app
            # Keep the two previous releases, drop the rest.
            cd /var/www/translator-app/releases
            ls -1t | tail -n +4 | while read -r d; do rm -rf "$d"; done
            echo "published $ver"

      - name: Result in summary
        if: always()
        run: |
          {
            echo "### Translator app (web)"
            echo "- version: ${{ env.APP_VERSION }}"
            echo "- url: https://iq-translate.com/app/"
          } >> "$GITHUB_STEP_SUMMARY"

  # Android: релизный APK. Собирается на маке — все таргеты на macOS-раннерах. Публикуется на VPS.
  android:
    concurrency:
      group: iq-translate-app-android
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # SDK в образе уже стоит: принимаем лицензии, нужные компоненты доставляем по
      # возможности, а остальное Gradle добирает сам.
      - name: Android SDK (platform 36, build-tools 36)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER" || { echo "нет sdkmanager в $SDK"; ls "$SDK"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            || echo "компоненты SDK не доустановились — собираем на том, что есть в образе"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Подпись читает flutter/android/app/build.gradle.kts — путь ../keystore.properties.
      # Ключ обязан быть тем же, что у уже установленного приложения: с другой подписью
      # APK поверх не встанет, придётся удалять приложение.
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "нет секрета ANDROID_KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          chmod 600 "$RUNNER_TEMP/keystore/release.jks"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/keystore/release.jks" \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > flutter/android/keystore.properties
          chmod 600 flutter/android/keystore.properties

      - name: Версия из pubspec
        working-directory: flutter
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          ver="${raw%%+*}"
          code="${raw##*+}"
          test -n "$ver" || { echo "в pubspec.yaml нет version"; exit 1; }
          test "$code" != "$raw" || { echo "в version нет номера сборки после «+»: $raw"; exit 1; }
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "собираю $ver (номер $code)"

      - name: Анализ и сборка релиза
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Артефакт в корне
        run: |
          cp flutter/build/app/outputs/flutter-apks/app-release.apk "$GITHUB_WORKSPACE/translator-release.apk"
          ls -lh "$GITHUB_WORKSPACE/translator-release.apk"

      - name: Install nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/translator.conf"
          target: "/etc/nginx/sites-available/"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv -f /etc/nginx/sites-available/translator.conf /etc/nginx/sites-available/iq-translate.conf
            ln -sf /etc/nginx/sites-available/iq-translate.conf /etc/nginx/sites-enabled/iq-translate.conf
            nginx -t && (sudo nginx -s reload || systemctl reload nginx)

      - name: Prepare staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/translator-app-files/translator/android/staging

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "translator-release.apk"
          target: "/var/www/translator-app-files/translator/android/staging/"
          overwrite: true

      - name: Upload publish script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/vps-publish.sh"
          target: "/tmp/"
          overwrite: true

      - name: Publish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            FORCE_ARGS=()
            if [ "${{ inputs.force }}" = "true" ]; then FORCE_ARGS+=(--force); fi
            VPS_FILES_ROOT=/var/www/translator-app-files/translator bash /tmp/vps-publish.sh \
              android "${{ env.APP_VERSION }}" "${{ env.APP_VERSION_CODE }}" translator-release.apk \
              ${FORCE_ARGS[@]+"${FORCE_ARGS[@]}"}

      - name: Result in summary
        if: always()
        run: |
          {
            echo "### Android-клиент (Flutter)"
            echo "- версия: ${{ env.APP_VERSION }} (номер ${{ env.APP_VERSION_CODE }})"
            echo "- version.json: https://iq-translate.com/files/translator/android/version.json"
          } >> "$GITHUB_STEP_SUMMARY"

  # iOS: .ipa, Ad Hoc. Собирается только на маке (Xcode). Публикуется на VPS.
  ios:
    concurrency:
      group: iq-translate-app-ios
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # CocoaPods на образах раннера обычно уже стоит, но от него зависит вся сборка iOS.
      - name: CocoaPods
        run: pod --version || brew install cocoapods

      - name: Версия из pubspec
        working-directory: flutter
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          ver="${raw%%+*}"
          code="${raw##*+}"
          test -n "$ver" || { echo "в pubspec.yaml нет version"; exit 1; }
          test "$code" != "$raw" || { echo "в version нет номера сборки после «+»: $raw"; exit 1; }
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "собираю $ver (номер $code)"

      # Ключ приходит секретом в base64: файл живёт до конца задания во временном каталоге
      # раннера, в репозиторий и в артефакты не попадает.
      - name: Ключ App Store Connect
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$KEY_P8" || { echo "нет секрета ASC_KEY_P8"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$KEY_P8" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_FILE=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Падаем до сборки, а не после: без сертификатов скрипт ушёл бы в режим для своего
      # мака и Xcode снова начал бы выпускать их на раннере.
      - name: Сертификаты подписи на месте
        env:
          IOS_SIGNING_PEM: ${{ secrets.IOS_SIGNING_PEM }}
        run: |
          test -n "$IOS_SIGNING_PEM" || {
            echo "нет секрета IOS_SIGNING_PEM — сертификаты готовит scripts/asc-signing-setup.mjs" >&2
            exit 1
          }

      # Сборка, подпись и экспорт .ipa. Скрипт кладёт результат в translator.ipa в корне.
      - name: Сборка и подпись
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_SIGNING_PEM: ${{ secrets.IOS_SIGNING_PEM }}
        run: ./scripts/build-ios.sh

      - name: Артефакт в корне
        run: |
          ls -lh "$GITHUB_WORKSPACE/translator.ipa"

      - name: Install nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/translator.conf"
          target: "/etc/nginx/sites-available/"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv -f /etc/nginx/sites-available/translator.conf /etc/nginx/sites-available/iq-translate.conf
            ln -sf /etc/nginx/sites-available/iq-translate.conf /etc/nginx/sites-enabled/iq-translate.conf
            nginx -t && (sudo nginx -s reload || systemctl reload nginx)

      - name: Prepare staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/translator-app-files/translator/ios/staging

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "translator.ipa"
          target: "/var/www/translator-app-files/translator/ios/staging/"
          overwrite: true

      - name: Upload publish script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/vps-publish.sh"
          target: "/tmp/"
          overwrite: true

      - name: Publish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            FORCE_ARGS=()
            if [ "${{ inputs.force }}" = "true" ]; then FORCE_ARGS+=(--force); fi
            VPS_FILES_ROOT=/var/www/translator-app-files/translator bash /tmp/vps-publish.sh \
              ios "${{ env.APP_VERSION }}" "${{ env.APP_VERSION_CODE }}" translator.ipa \
              ${FORCE_ARGS[@]+"${FORCE_ARGS[@]}"}

      - name: Result in summary
        if: always()
        run: |
          {
            echo "### Приложение для iPad и iPhone"
            echo "- версия: ${{ env.APP_VERSION }} (номер ${{ env.APP_VERSION_CODE }})"
            echo "- version.json: https://iq-translate.com/files/translator/ios/version.json"
            echo "- сборка Ad Hoc: ставится только на устройства из профиля"
          } >> "$GITHUB_STEP_SUMMARY"

  # macOS: архив с приложением. Собирается только на маке (Xcode). Публикуется на VPS.
  macos:
    concurrency:
      group: iq-translate-app-macos
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Версия из pubspec
        working-directory: flutter
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          ver="${raw%%+*}"
          code="${raw##*+}"
          test -n "$ver" || { echo "в pubspec.yaml нет version"; exit 1; }
          test "$code" != "$raw" || { echo "в version нет номера сборки после «+»: $raw"; exit 1; }
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "собираю $ver (номер $code)"

      - name: Анализ и сборка релиза
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter build macos --release

      # ditto, а не zip: сохраняет права и символические ссылки внутри бандла — обычный
      # zip их теряет, и распакованное приложение не запускается.
      - name: Артефакт в корне
        working-directory: flutter/build/macos/Build/Products/Release
        run: |
          ditto -c -k --keepParent iq_translate.app "$GITHUB_WORKSPACE/translator.zip"
          ls -lh "$GITHUB_WORKSPACE/translator.zip"

      - name: Install nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/translator.conf"
          target: "/etc/nginx/sites-available/"

      - name: Reload nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv -f /etc/nginx/sites-available/translator.conf /etc/nginx/sites-available/iq-translate.conf
            ln -sf /etc/nginx/sites-available/iq-translate.conf /etc/nginx/sites-enabled/iq-translate.conf
            nginx -t && (sudo nginx -s reload || systemctl reload nginx)

      - name: Prepare staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p /var/www/translator-app-files/translator/macos/staging

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "translator.zip"
          target: "/var/www/translator-app-files/translator/macos/staging/"
          overwrite: true

      - name: Upload publish script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/vps-publish.sh"
          target: "/tmp/"
          overwrite: true

      - name: Publish
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            FORCE_ARGS=()
            if [ "${{ inputs.force }}" = "true" ]; then FORCE_ARGS+=(--force); fi
            VPS_FILES_ROOT=/var/www/translator-app-files/translator bash /tmp/vps-publish.sh \
              macos "${{ env.APP_VERSION }}" "${{ env.APP_VERSION_CODE }}" translator.zip \
              ${FORCE_ARGS[@]+"${FORCE_ARGS[@]}"}

      - name: Result in summary
        if: always()
        run: |
          {
            echo "### Настольное приложение (macOS)"
            echo "- версия: ${{ env.APP_VERSION }} (номер ${{ env.APP_VERSION_CODE }})"
            echo "- version.json: https://iq-translate.com/files/translator/macos/version.json"
            echo "- сборка без подписи: годится для обновления из приложения,"
            echo "  но не для передачи на другой мак (там нужен Developer ID и нотаризация)"
          } >> "$GITHUB_STEP_SUMMARY"
